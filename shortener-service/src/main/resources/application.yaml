app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

logging:
  structured:
    format: logstash

spring:
  application:
    name: shortener-service
  webflux:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  datasource:
    url: jdbc:postgresql://localhost:5432/url_shortener?currentSchema=short_url
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000
      pool-name: HikariPool
      metrics-name: HikariPool
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    schemas: short_url
    locations: classpath:db/migration/short_url
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        metrics:
          enabled: true
management:
  endpoints:
    web:
      base-path: /api/v1/actuator
      exposure:
        include: health,info,prometheus
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.shvmpk.shortener_service.exception.BaseApiException
  retry:
    configs:
      default:
        max-retry-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
    instances:
      url-verify:
        base-config: default
        max-retry-attempts: 2
        wait-duration: 1s

server:
  port: 8081