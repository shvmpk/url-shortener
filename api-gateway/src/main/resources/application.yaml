server:
  port: 8080

logging:
  structured:
    format: logstash

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
        metrics:
          enabled: true
  cloud:
    gateway:
      default-filters:
        - name: DedupeResponseHeader
          args:
            name: Access-Control-Allow-Origin

management:
  endpoints:
    web:
      base-path: /api/v1/actuator
      exposure:
        include: health,info,prometheus,gateway
    health:
      probes:
        enabled: true
  endpoint:
    gateway:
      access: read-only
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      shortenerCircuitBreaker:
        base-config: default
      redirectCircuitBreaker:
        base-config: default
      analyticsCircuitBreaker:
        base-config: default
