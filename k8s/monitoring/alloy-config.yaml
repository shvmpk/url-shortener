apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: url-shortener
data:
  config.alloy: |
    // Collect container logs from Docker socket
    local.file_match "container_logs" {
      path_targets = [{"__path__" = "/var/log/pods/*/*/*.log"}]
    }

    loki.process "container_logs" {
      stage.multiline {
        firstline = "^(\\d{4}-\\d{2}-\\d{2})"
      }

      stage.regex {
        expression = "^(?s)(?P<content>.*)"
      }

      stage.output {
        source = "content"
      }
    }

    loki.source.file "container_logs" {
      targets    = local.file_match.container_logs.targets
      forward_to = [loki.process.container_logs.receiver]
    }

    // Forward logs to Loki
    loki.write "loki" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }
